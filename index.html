<head>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2323395d'/%3E%3Cpath d='M32 12v40M20 24h24' stroke='%23e2bb6a' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Modo claro/oscuro antes de pintar: el elegido con el botón o, si no, el del sistema
    (function () {
      var t = null; try { t = localStorage.getItem('teso_tema'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      if (t === 'dark') document.querySelector('meta[name=theme-color]').setAttribute('content', '#0c111b');
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="backend/Core.js"></script>
  <script type="module" src="js/app.js"></script>
</head>

  <div id="app"><div class="boot"><div class="spinner"></div></div></div>

</body>
